# ==============================================================================
# CẤU HÌNH NGINX CHUẨN CHO DỰ ÁN NAMNGHE-AUDIO (NGHE TRUYỆN AUDIO ONLINE)
# Đường dẫn cài đặt mẫu: /root/NAMNGHE-AUDIO
# Đường dẫn file Nginx trên VPS: /etc/nginx/sites-available/namnghe-audio
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Thay bằng domain thật của bạn

    # 1. CHO PHÉP UPLOAD FILE MP3 VÀ BACKUP DUNG LƯỢNG LỚN (LÊN TỚI 250MB)
    client_max_body_size 250M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    large_client_header_buffers 4 32k;

    # 2. TỐI ƯU GZIP (Nén HTML, CSS, JS, JSON - TUYỆT ĐỐI KHÔNG NÉN MP3/AUDIO)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # 3. PHỤC VỤ TRỰC TIẾP TẬP TIN AUDIO & ẢNH UPLOAD (LOAD ĐẾN ĐÂU NGHE ĐẾN ĐÓ)
    # Cơ chế: Hỗ trợ Byte-Range (HTTP 206 Partial Content), không buffer toàn bộ file
    location /uploads/ {
        alias /root/NAMNGHE-AUDIO/uploads/; # Đổi thành đường dẫn thư mục uploads thực tế của bạn
        
        # Bật Byte-Range để trình duyệt và điện thoại tải từng đoạn nhỏ (1.5MB) nghe ngay
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;

        # Tối ưu truyền tải file âm thanh từ ổ đĩa Linux ra mạng cực nhanh
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        # TẮT BUFFERING: Bắt buộc để người nghe bấm phát là âm thanh chạy ngay lập tức
        proxy_buffering off;
        proxy_request_buffering off;

        # Không cho phép thực thi script nguy hiểm trong thư mục uploads
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # 4. CHUYỂN TOÀN BỘ YÊU CẦU API, GATEWAY VÀ GIAO DIỆN VÀO NODE.JS (PORT 3000)
    # Khắc phục triệt để lỗi: <!doctype html> ... is not valid JSON
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Hỗ trợ WebSocket / HMR nếu có
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Truyền đúng Host và IP thực của người dùng (kể cả khi qua Cloudflare)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout dài cho các tác vụ upload file MP3 lớn
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer cho API JSON
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
