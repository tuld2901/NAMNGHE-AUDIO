# ==============================================================================
# CẤU HÌNH NGINX CHUẨN CHỊU TẢI CAO CHO DỰ ÁN NAMNGHE-AUDIO (NAMNGHE.COM)
# Đường dẫn cài đặt trên VPS: /root/NAMNGHE-AUDIO
# Đường dẫn file Nginx trên VPS: /etc/nginx/sites-available/namnghe.com
# ==============================================================================

# 1. KHAI BÁO VÙNG NHỚ GIỚI HẠN ĐĂNG NHẬP ADMIN: TỐI ĐA 5 LẦN / 1 PHÚT THEO IP
limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=5r/m;

# 2. KHAI BÁO UPSTREAM POOL KẾT NỐI BỀN VỮNG (KEEP-ALIVE) TỚI NODE.JS PORT 3000
upstream audio_node_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name namnghe.com www.namnghe.com;

    # ==========================================================================
    # A. CẤU HÌNH UPLOAD FILE MP3 LỚN & TỐI ƯU KẾT NỐI
    # ==========================================================================
    client_max_body_size 250M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    large_client_header_buffers 4 32k;

    # Bộ nhớ đệm File Descriptor cấp hệ điều hành giúp hàng nghìn người mở cùng 1 file MP3 không phải tra cứu lại ổ cứng
    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ==========================================================================
    # B. TỐI ƯU GZIP (Chỉ nén HTML, CSS, JS, JSON - TUYỆT ĐỐI KHÔNG NÉN MP3)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # ==========================================================================
    # C. GIAO HOÀN TOÀN VIỆC ĐỌC, PHÁT & TUA AUDIO CHO NGINX (/uploads/)
    # Kết hợp với <audio preload="metadata"> trên trình duyệt:
    # - Khi mới vào chỉ tải vài KB đầu để lấy số phút.
    # - Người dùng nghe tới đâu hoặc kéo tua tới đâu, Nginx dùng sendfile + aio threads
    #   cắt từng đoạn nhỏ (HTTP 206 Byte-Range, mỗi lần tối đa 512KB) gửi tới đó.
    # - Hoàn toàn KHÔNG đi qua Node.js, giải phóng 100% RAM và CPU cho VPS.
    # ==========================================================================
    location ^~ /uploads/ {
        alias /root/NAMNGHE-AUDIO/uploads/; # Đổi thành đường dẫn thư mục uploads thực tế trên VPS của bạn

        # Đọc file trực tiếp từ Kernel Linux (Zero-Copy + Đa luồng bất đồng bộ)
        sendfile on;
        sendfile_max_chunk 512k; # Giới hạn mỗi lần gửi 512KB để 1 người không chiếm hết băng thông của người khác
        tcp_nopush on;
        tcp_nodelay on;
        aio threads;
        directio 4m;             # File lớn hơn 4MB đọc thẳng bằng Direct I/O không làm đầy RAM cache
        output_buffers 2 1m;

        # Hỗ trợ tua nhanh (HTTP 206 Partial Content / Byte-Range) & Cache trình duyệt
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000, immutable, no-transform" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        expires 30d;
        access_log off;          # Tắt ghi log từng chunk MP3 để tránh nghẽn I/O ổ cứng khi đông người nghe

        # Chặn thực thi script độc hại trong thư mục uploads
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # ==========================================================================
    # D. GIỚI HẠN 5 LẦN ĐĂNG NHẬP / 1 PHÚT CHO TRANG QUẢN TRỊ (/app-config)
    # ==========================================================================
    location = /api/admin/login {
        limit_req zone=admin_login_limit burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;

        proxy_pass http://audio_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":"Bạn đã thử đăng nhập quá 5 lần trong 1 phút. Vui lòng đợi 1 phút rồi thử lại!"}';
    }

    # ==========================================================================
    # E. CỔNG API ĐỘNG (/api/bootstrap, /api/gateway, /api/tracks, /api/upload-audio)
    # ==========================================================================
    location ^~ /api/ {
        proxy_pass http://audio_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 250M;
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ==========================================================================
    # F. GIAO DIỆN WEB & SEO SSR (CHUYỂN TIẾP VÀO NODE.JS PORT 3000)
    # ==========================================================================
    location / {
        proxy_pass http://audio_node_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}


