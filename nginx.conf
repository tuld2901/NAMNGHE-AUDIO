# ==============================================================================
# CẤU HÌNH NGINX CHUẨN CHO DỰ ÁN NAMNGHE-AUDIO (NGHE TRUYỆN AUDIO ONLINE)
# Đường dẫn cài đặt mẫu: /root/NAMNGHE-AUDIO
# Đường dẫn file Nginx trên VPS: /etc/nginx/sites-available/namnghe-audio
# ==============================================================================

# KHAI BÁO VÙNG NHỚ GIỚI HẠN ĐĂNG NHẬP ADMIN: TỐI ĐA 5 LẦN / 1 PHÚT THEO IP
limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Thay bằng domain thật của bạn

    # 1. CHO PHÉP UPLOAD FILE MP3 VÀ BACKUP DUNG LƯỢNG LỚN (LÊN TỚI 250MB)
    client_max_body_size 250M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    large_client_header_buffers 4 32k;

    # 2. TỐI ƯU GZIP (Nén HTML, CSS, JS, JSON - TUYỆT ĐỐI KHÔNG NÉN MP3/AUDIO)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # 3. PHỤC VỤ TRỰC TIẾP TẬP TIN AUDIO & ẢNH UPLOAD (LOAD ĐẾN ĐÂU NGHE ĐẾN ĐÓ)
    # Cơ chế: Hỗ trợ Byte-Range (HTTP 206 Partial Content), không buffer toàn bộ file
    location /uploads/ {
        alias /root/NAMNGHE-AUDIO/uploads/; # Đổi thành đường dẫn thư mục uploads thực tế của bạn
        
        # Bật Byte-Range để trình duyệt và điện thoại tải từng đoạn nhỏ nghe ngay, tua mượt mà
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=2592000, immutable, no-transform" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        expires 30d;

        # Tối ưu truyền tải file âm thanh từ ổ đĩa Linux ra mạng cực nhanh
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;

        # TẮT BUFFERING: Bắt buộc để người nghe bấm phát là âm thanh chạy ngay lập tức
        proxy_buffering off;
        proxy_request_buffering off;

        # Không cho phép thực thi script nguy hiểm trong thư mục uploads
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # 3A. GIỚI HẠN 5 LẦN ĐĂNG NHẬP / 1 PHÚT CHO TRANG QUẢN TRỊ (/app-config)
    location = /api/admin/login {
        limit_req zone=admin_login_limit burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":"Bạn đã thử đăng nhập quá 5 lần trong 1 phút. Vui lòng đợi 1 phút rồi thử lại!"}';
    }

    # 3B. ƯU TIÊN TUYỆT ĐỐI CHO TOÀN BỘ CỔNG API (/api/gateway, /api/upload-audio, /api/stream-audio, /api/tracks)
    # Dùng ^~ để chặn các rule regex tĩnh của aaPanel/Nginx nuốt mất request JSON hoặc trả về lỗi 404/405 HTML
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 250M;
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 4. CHUYỂN TOÀN BỘ YÊU CẦU GIAO DIỆN VÀO NODE.JS (PORT 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Hỗ trợ WebSocket / HMR nếu có
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Truyền đúng Host và IP thực của người dùng (kể cả khi qua Cloudflare)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout dài cho các tác vụ upload file MP3 lớn
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer cho API JSON
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

