  <body class="bg-[#121212] text-white antialiased selection:bg-[#1db954]/30 selection:text-[#1ed760] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- In-App Browser Blocker (Chia 2 trường hợp: iOS mở Safari như ảnh, Android mở Chrome) -->
    <div id="browser-block" style="display:none">
      <h2>Vui lòng mở bằng trình duyệt ngoài</h2>
      <p>Trên iPhone/iPad vui lòng mở bằng Safari. Trên Android vui lòng mở bằng Chrome.</p>
      <p>Hãy bấm menu ⋯ trong ứng dụng và chọn Mở bằng trình duyệt ngoài.</p>
    </div>

    <style>
      #browser-blocker-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 20px;
        box-sizing: border-box;
      }

      /* GIAO DIỆN CHẶN TRÌNH DUYỆT THANH THOÁT CHUẨN SPOTIFY DARK CHO CẢ IOS & ANDROID */
      .spotify-cab-card {
        background: #181818;
        border: 1px solid #282828;
        border-radius: 26px;
        padding: 28px 22px;
        max-width: 350px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        box-sizing: border-box;
        color: #ffffff;
      }
      .spotify-cab-title {
        color: #ffffff;
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 10px;
        line-height: 1.35;
      }
      .spotify-cab-desc {
        color: #b3b3b3;
        font-size: 13.5px;
        line-height: 1.55;
        margin: 0 0 16px;
      }
      .spotify-cab-desc b {
        color: #ffffff;
      }
      .spotify-cab-btn-primary {
        display: block;
        width: 100%;
        background: #1ed760;
        color: #000000;
        font-weight: 700;
        font-size: 14px;
        padding: 12.5px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(30, 215, 96, 0.25);
        margin-bottom: 14px;
        border: none;
        box-sizing: border-box;
        transition: all 0.2s ease;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .spotify-cab-btn-primary:active {
        opacity: 0.85;
        transform: scale(0.98);
      }
      .spotify-cab-box {
        border: 1px solid rgba(30, 215, 96, 0.35);
        background: rgba(30, 215, 96, 0.06);
        border-radius: 14px;
        padding: 13px 16px;
        text-align: left;
        margin-bottom: 16px;
      }
      .spotify-cab-box-title {
        color: #1ed760;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .spotify-cab-box-step {
        color: #e5e5e5;
        font-size: 13.5px;
        line-height: 1.5;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .spotify-cab-divider {
        color: #535353;
        font-size: 12px;
        margin: 12px 0 14px;
      }
      .spotify-cab-label {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        text-align: left;
        margin-bottom: 6px;
        display: block;
      }
      .spotify-cab-input {
        background: #242424;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 11px 12px;
        font-size: 16px; /* Bắt buộc tối thiểu 16px trên iOS & Android để không bao giờ bị auto zoom màn hình */
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #e5e5e5;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        text-align: center;
        outline: none;
        touch-action: manipulation;
        -webkit-user-select: all;
        user-select: all;
      }
      .spotify-cab-copy-btn {
        background: #242424;
        border: 1px solid #3e3e3e;
        border-radius: 12px;
        padding: 13px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        width: 100%;
        cursor: pointer;
        transition: all 0.2s ease;
        box-sizing: border-box;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .spotify-cab-copy-btn:hover {
        background: #2e2e2e;
        border-color: #555555;
      }
      .spotify-cab-copy-btn:active {
        background: #1ed760;
        color: #000000;
        border-color: #1ed760;
        transform: scale(0.98);
      }
      .spotify-cab-tip {
        font-size: 12.5px;
        color: #727272;
        margin: 12px 0 0;
        line-height: 1.4;
      }
    </style>

    <script>
      (() => {
        function initBrowserBlocker() {
          try {
            const path = (window.location.pathname || '').toLowerCase();
            // Không chặn trang quản trị CMS
            if (path.includes('admin') || path.includes('quan-tri')) return;

            // Không chặn nếu quản trị viên đã tắt tính năng này trong cài đặt CMS
            try {
              if (window.__SITE_SETTINGS__ && window.__SITE_SETTINGS__.socialBlockerEnabled === false) return;
              const cached = localStorage.getItem('site_settings_cache');
              if (cached && JSON.parse(cached).socialBlockerEnabled === false) return;
            } catch (e) {}

            const ua = navigator.userAgent || navigator.vendor || window.opera || '';

            // 1. Nhận diện các trình duyệt In-App mạng xã hội
            const inAppZalo = /Zalo/i.test(ua);
            const inAppFB = /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua);
            const inAppMessenger = /Messenger/i.test(ua);
            const inAppTikTok = /TikTok|musical_ly|BytedanceWebview/i.test(ua);
            const inAppInstagram = /Instagram/i.test(ua);
            const inAppOther = /Threads|Line\/|Twitter|Snapchat/i.test(ua);

            const isInApp = inAppZalo || inAppFB || inAppMessenger || inAppTikTok || inAppInstagram || inAppOther;

            let inAppName = 'mạng xã hội';
            if (inAppZalo) inAppName = 'Zalo';
            else if (inAppFB) inAppName = 'Facebook';
            else if (inAppMessenger) inAppName = 'Messenger';
            else if (inAppTikTok) inAppName = 'TikTok';
            else if (inAppInstagram) inAppName = 'Instagram';

            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const isAndroid = /Android/i.test(ua);
            const isDesktop = !isIOS && !isAndroid;

            // ========================================================
            // PHÂN CHIA 2 TRƯỜNG HỢP:
            // 1: NẾU LÀ IOS (IPHONE / IPAD)
            //    - Nếu trong Safari chuẩn hoặc Chrome ngoài (không phải inApp): CHO PHÉP DUYỆT!
            //    - Nếu trong in-app browser (Zalo, FB, TikTok...): CHẶN và hiện hộp thoại Spotify thanh thoát mở Safari!
            // 2: NẾU LÀ ANDROID
            //    - Nếu là Chrome ngoài (không inApp, không Samsung/Opera): CHO PHÉP DUYỆT!
            //    - Nếu in-app browser: CHẶN và hiện hộp thoại Spotify thanh thoát mở Chrome!
            // ========================================================

            if (isIOS) {
              if (!isInApp) return; // Đang ở trong Safari chuẩn hoặc Chrome trên iOS -> Duyệt web bình thường!
            } else if (isAndroid) {
              const isAndroidChrome = /Chrome\//i.test(ua) && !/EdgA|OPR|SamsungBrowser|UCBrowser/i.test(ua);
              if (!isInApp && isAndroidChrome) return; // Đang ở trong Chrome chuẩn trên Android -> Duyệt web bình thường!
            } else if (isDesktop) {
              return; // Máy tính duyệt web bình thường!
            }

            // Dừng phát âm thanh ngầm nếu có
            try {
              document.querySelectorAll('audio, video').forEach(el => el.pause());
            } catch (e) {}

            // Ẩn nội dung web
            const rootEl = document.getElementById('root');
            if (rootEl) rootEl.style.display = 'none';
            document.body.style.overflow = 'hidden';

            if (document.getElementById('browser-blocker-overlay')) return;

            const currentUrl = window.location.href;
            const isHttps = window.location.protocol === 'https:';

            const overlay = document.createElement('div');
            overlay.id = 'browser-blocker-overlay';

            // GIAO DIỆN TRƯỜNG HỢP 1: DÀNH CHO IOS (BẢNG MÀU SPOTIFY DARK THANH THOÁT CHUẨN)
            if (isIOS) {
              overlay.innerHTML = `
                <div class="spotify-cab-card">
                  <h3 class="spotify-cab-title">Bạn đang mở trong ${inAppName}</h3>
                  <p class="spotify-cab-desc">
                    Trình duyệt trong ${inAppName} <b>không nghe audio được</b>. Hãy mở bằng <b>Safari (trình duyệt ngoài)</b> để tiếp tục nghe.
                  </p>

                  <div class="spotify-cab-box">
                    <div class="spotify-cab-box-title">Cách mở bằng Safari:</div>
                    <div class="spotify-cab-box-step">1. Bấm nút <b style="color: #1ed760;">⋯</b> ở góc trên bên phải</div>
                    <div class="spotify-cab-box-step">2. Chọn <b style="color: #1ed760;">“Mở trong trình duyệt”</b></div>
                  </div>

                  <div class="spotify-cab-divider">– hoặc –</div>

                  <div class="spotify-cab-label">Sao chép liên kết:</div>
                  <input type="text" class="spotify-cab-input" id="cab-url-box" value="${currentUrl}" readonly />
                  <button type="button" class="spotify-cab-copy-btn" id="cab-copy-btn">Sao chép liên kết</button>
                  <p class="spotify-cab-tip" id="cab-copy-status">Rồi dán vào Safari để mở.</p>
                </div>
              `;
            } 
            // GIAO DIỆN TRƯỜNG HỢP 2: DÀNH CHO ANDROID (THANH THOÁT NHƯ IOS - BẢNG MÀU SPOTIFY DARK - NÚT INTENT CHROME XANH)
            else {
              const androidChromeUrl = 'intent://' + window.location.host + window.location.pathname + window.location.search + '#Intent;scheme=' + (isHttps ? 'https' : 'http') + ';package=com.android.chrome;end';

              overlay.innerHTML = `
                <div class="spotify-cab-card">
                  <h3 class="spotify-cab-title">Bạn đang mở trong ${inAppName}</h3>
                  <p class="spotify-cab-desc">
                    Trình duyệt trong ${inAppName} <b>không nghe audio được</b>. Hãy mở bằng <b>Google Chrome</b> để tiếp tục nghe.
                  </p>

                  <a href="${androidChromeUrl}" class="spotify-cab-btn-primary" id="bb-open-chrome-btn">
                    Mở bằng Google Chrome
                  </a>

                  <div class="spotify-cab-box">
                    <div class="spotify-cab-box-title">Cách mở bằng Chrome:</div>
                    <div class="spotify-cab-box-step">1. Bấm nút <b style="color: #1ed760;">⋯</b> ở góc trên bên phải</div>
                    <div class="spotify-cab-box-step">2. Chọn <b style="color: #1ed760;">“Mở bằng trình duyệt ngoài”</b></div>
                  </div>

                  <div class="spotify-cab-divider">– hoặc –</div>

                  <div class="spotify-cab-label">Sao chép liên kết:</div>
                  <input type="text" class="spotify-cab-input" id="cab-url-box" value="${currentUrl}" readonly />
                  <button type="button" class="spotify-cab-copy-btn" id="cab-copy-btn">Sao chép liên kết</button>
                  <p class="spotify-cab-tip" id="cab-copy-status">Rồi dán vào Google Chrome để mở.</p>
                </div>
              `;
            }

            document.body.appendChild(overlay);

            // ==========================================
            // KỸ THUẬT SAO CHÉP LIÊN KẾT TỐI ƯU HÓA 100% CHO IOS VÀ ANDROID (CHỐNG ZOOM TUYỆT ĐỐI)
            // ==========================================
            const copyUrlToClipboard = (inputEl, btnEl, statusEl, successTip) => {
              let copied = false;

              // 1. Thử qua Navigator Clipboard API hiện đại trước
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentUrl).then(() => {
                  copied = true;
                }).catch(() => {});
              }

              // 2. Kỹ thuật sao chép textarea ẩn chuẩn iOS & Android - KHÔNG GÂY ZOOM MÀN HÌNH
              try {
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = currentUrl;
                tempTextarea.setAttribute('readonly', '');
                // font-size 16px bắt buộc để iOS không bao giờ tự zoom
                tempTextarea.style.position = 'fixed';
                tempTextarea.style.top = '0';
                tempTextarea.style.left = '-9999px';
                tempTextarea.style.width = '2em';
                tempTextarea.style.height = '2em';
                tempTextarea.style.padding = '0';
                tempTextarea.style.border = 'none';
                tempTextarea.style.outline = 'none';
                tempTextarea.style.boxShadow = 'none';
                tempTextarea.style.background = 'transparent';
                tempTextarea.style.fontSize = '16px';
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                tempTextarea.setSelectionRange(0, tempTextarea.value.length);
                const execSuccess = document.execCommand('copy');
                if (execSuccess) copied = true;
                document.body.removeChild(tempTextarea);
              } catch (e) {}

              // 3. KHÔNG gọi inputEl.focus() để tránh kích hoạt bàn phím và tự động phóng to màn hình iOS
              if (inputEl) {
                try {
                  inputEl.blur();
                } catch (e) {}
              }

              // 4. Cập nhật UI phản hồi tức thì với màu xanh Spotify #1ed760
              if (btnEl) {
                btnEl.textContent = '✓ Đã sao chép liên kết!';
                btnEl.style.background = '#1ed760';
                btnEl.style.color = '#000000';
                btnEl.style.borderColor = '#1ed760';
              }
              if (statusEl) {
                statusEl.style.color = '#1ed760';
                statusEl.innerHTML = `<b>✓ Đã sao chép!</b> ${successTip}`;
              }

              setTimeout(() => {
                if (btnEl) {
                  btnEl.textContent = 'Sao chép liên kết';
                  btnEl.style.background = '#242424';
                  btnEl.style.color = '#ffffff';
                  btnEl.style.borderColor = '#3e3e3e';
                }
              }, 3000);
            };

            const copyBtn = document.getElementById('cab-copy-btn');
            const urlInput = document.getElementById('cab-url-box');
            const statusTip = document.getElementById('cab-copy-status');
            const targetBrowserName = isIOS ? 'Safari' : 'Google Chrome';

            if (copyBtn) {
              copyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                copyUrlToClipboard(urlInput, copyBtn, statusTip, `Hãy mở ${targetBrowserName} và dán vào thanh địa chỉ nhé!`);
              });
            }
            if (urlInput) {
              urlInput.addEventListener('click', (e) => {
                e.preventDefault();
                urlInput.blur();
                copyUrlToClipboard(urlInput, copyBtn, statusTip, `Hãy mở ${targetBrowserName} và dán vào thanh địa chỉ nhé!`);
              });
            }

          } catch (err) {
            console.warn('Browser block check error:', err);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initBrowserBlocker);
        } else {
          initBrowserBlocker();
        }
      })();
    </script>
  </body>
