    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gối Ôm Audio - Web Nghe Truyện Audio Online Miễn Phí" />
    <meta name="twitter:description" content="Thưởng Thức Truyện Audio Mọi Lúc Mọi Nơi — 200 audio · nghe miễn phí, không cần tài khoản." />

    <!-- Base JSON-LD Schema for Google Search -->
    <script id="seo-jsonld-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Gối Ôm Audio",
          "url": "/",
          "description": "Thưởng Thức Truyện Audio Mọi Lúc Mọi Nơi — 200 audio · nghe miễn phí, không cần tài khoản.",
          "inLanguage": "vi-VN"
        },
        {
          "@type": "Organization",
          "name": "Gối Ôm Audio",
          "url": "/",
          "logo": "https://api.iconify.design/lucide:headphones.svg?color=%23f59e0b"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- In-App Browser Blocker (Chặn trình duyệt mạng xã hội, yêu cầu mở Chrome / Safari) -->
    <div id="browser-block" style="display:none">
      <h2>Vui lòng mở bằng trình duyệt ngoài</h2>
      <p>Website chỉ hỗ trợ Chrome trên Android và Safari trên iPhone.</p>
      <p>Hãy bấm menu ⋯ trong ứng dụng và chọn Mở bằng trình duyệt.</p>
    </div>

    <script>
      (() => {
        try {
          const path = (window.location.pathname || '').toLowerCase();
          // Không chặn trang quản trị CMS
          if (path.includes('admin') || path.includes('quan-tri')) return;

          // Kiểm tra xem quản trị viên có tắt tính năng chặn này trong CMS không
          try {
            if (window.__SITE_SETTINGS__ && window.__SITE_SETTINGS__.socialBlockerEnabled === false) return;
            const cached = localStorage.getItem('site_settings_cache');
            if (cached && JSON.parse(cached).socialBlockerEnabled === false) return;
          } catch (e) {}

          const ua = navigator.userAgent || navigator.vendor || window.opera || '';
          const inApp =
            /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Zalo|Line\/|musical_ly|BytedanceWebview/i.test(ua);

          const isIOS = /iPhone|iPad|iPod/i.test(ua);
          const isAndroid = /Android/i.test(ua);
          const isDesktop = !isIOS && !isAndroid;

          const isChrome = /CriOS/i.test(ua) ||
            (isAndroid && /Chrome\//i.test(ua) && !/EdgA|OPR|SamsungBrowser/i.test(ua));

          const isSafari = isIOS &&
            /Safari/i.test(ua) &&
            !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);

          // Cho phép máy tính (Desktop/Laptop) và chỉ cho phép Chrome (Android) hoặc Safari (iPhone) trên điện thoại
          const allowed = !inApp && (isChrome || isSafari || isDesktop);

          if (!allowed) {
            const currentUrl = window.location.href;
            let openChromeUrl = currentUrl;
            if (isAndroid) {
              openChromeUrl = 'intent://' + window.location.host + window.location.pathname + window.location.search + '#Intent;scheme=https;package=com.android.chrome;end';
            }

            document.documentElement.innerHTML = `
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>Vui lòng mở bằng Chrome hoặc Safari</title>
                <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body {
                    background: #09090b;
                    color: #f4f4f5;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    min-height: 100vh;
                    padding: 20px;
                  }
                  .bb-card {
                    background: #18181b;
                    border: 1px solid #27272a;
                    border-radius: 20px;
                    padding: 28px 22px;
                    max-width: 420px;
                    width: 100%;
                    text-align: center;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
                  }
                  .bb-icon { font-size: 40px; margin-bottom: 14px; }
                  h2 { font-size: 19px; font-weight: 700; color: #ffffff; margin-bottom: 10px; line-height: 1.4; }
                  p { color: #a1a1aa; font-size: 13.5px; line-height: 1.6; margin-bottom: 12px; }
                  .bb-guide {
                    background: #27272a;
                    border: 1px dashed #3f3f46;
                    border-radius: 12px;
                    padding: 12px 14px;
                    color: #fbbf24;
                    font-size: 13px;
                    font-weight: 600;
                    margin: 16px 0;
                    line-height: 1.5;
                  }
                  .bb-btn-primary {
                    display: block;
                    width: 100%;
                    background: linear-gradient(135deg, #f59e0b, #d97706);
                    color: #000;
                    font-weight: 700;
                    font-size: 14px;
                    padding: 13px;
                    border-radius: 10px;
                    text-decoration: none;
                    margin-bottom: 14px;
                    cursor: pointer;
                    border: none;
                  }
                  .bb-divider {
                    display: flex;
                    align-items: center;
                    color: #52525b;
                    font-size: 11px;
                    margin: 14px 0 10px;
                  }
                  .bb-divider::before, .bb-divider::after {
                    content: '';
                    flex: 1;
                    border-bottom: 1px solid #27272a;
                  }
                  .bb-divider::before { margin-right: 10px; }
                  .bb-divider::after { margin-left: 10px; }
                  .bb-input-group {
                    display: flex;
                    background: #09090b;
                    border: 1px solid #27272a;
                    border-radius: 10px;
                    overflow: hidden;
                    margin-bottom: 8px;
                  }
                  .bb-input {
                    background: transparent;
                    border: none;
                    color: #e4e4e7;
                    padding: 10px 12px;
                    font-size: 12px;
                    width: 100%;
                    outline: none;
                  }
                  .bb-btn-copy {
                    background: #27272a;
                    color: #f4f4f5;
                    border: none;
                    padding: 0 14px;
                    font-size: 12px;
                    font-weight: 600;
                    cursor: pointer;
                    white-space: nowrap;
                  }
                  .bb-tip { color: #71717a; font-size: 11px; }
                </style>
              </head>
              <body>
                <div class="bb-card">
                  <div class="bb-icon">🎧</div>
                  <h2>Vui lòng mở bằng Chrome hoặc Safari</h2>
                  <p>Trình duyệt hiện tại không được hỗ trợ.</p>
                  <p style="font-size: 12.5px; color: #71717a;">Website chỉ hỗ trợ <b>Chrome trên Android</b> và <b>Safari trên iPhone</b> để đảm bảo phát âm thanh ổn định.</p>
                  
                  <div class="bb-guide">
                    👉 Hãy bấm menu <b>⋯</b> (3 chấm) trong ứng dụng và chọn <b>Mở bằng trình duyệt</b>
                  </div>

                  <a href="${openChromeUrl}" style="text-decoration: none;">
                    <button type="button" class="bb-btn-primary">Mở bằng Trình duyệt Ngoài (Chrome)</button>
                  </a>

                  <div class="bb-divider">hoặc sao chép liên kết</div>

                  <div class="bb-input-group">
                    <input type="text" class="bb-input" id="bb-url-box" value="${currentUrl}" readonly />
                    <button type="button" class="bb-btn-copy" onclick="copyLink()">Sao chép</button>
                  </div>
                  <p class="bb-tip" id="bb-status">Dán link vào Chrome hoặc Safari để nghe nhé!</p>
                </div>

                <script>
                  function copyLink() {
                    const input = document.getElementById('bb-url-box');
                    input.select();
                    input.setSelectionRange(0, 99999);
                    const updateTip = () => {
                      const tip = document.getElementById('bb-status');
                      if (tip) {
                        tip.style.color = '#22c55e';
                        tip.innerText = 'Đã sao chép liên kết thành công!';
                        setTimeout(() => {
                          tip.style.color = '#71717a';
                          tip.innerText = 'Dán link vào Chrome hoặc Safari để nghe nhé!';
                        }, 2500);
                      }
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                      navigator.clipboard.writeText(input.value).then(updateTip).catch(() => {
                        try { document.execCommand('copy'); updateTip(); } catch (e) {}
                      });
                    } else {
                      try { document.execCommand('copy'); updateTip(); } catch (e) {}
                    }
                  }
                <\\/script>
              </body>
            `;
          }
        } catch (err) {
          console.warn('Browser block check error:', err);
        }
      })();
    </script>
  </body>
</html>
